<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>重設後台密碼｜誠創科技</title>
<link rel="icon" type="image/svg+xml" href="../chlogo.svg">
<link rel="stylesheet" href="admin.css">
<meta name="robots" content="noindex,nofollow,noarchive">
</head>
<body class="reset-password-page">
<main class="reset-shell">
<section class="reset-card">
<img src="../chlogo.svg" alt="誠創科技" class="reset-logo">
<span class="reset-eyebrow">CHENG CHUANG · ADMIN</span>
<h1>重設後台密碼</h1>
<p class="reset-intro" id="resetIntro">正在驗證重設連結…</p>
<form id="resetPasswordForm" hidden>
<label>新密碼<input id="resetPassword" type="password" autocomplete="new-password" minlength="8" required></label>
<label>再次確認新密碼<input id="resetPasswordConfirm" type="password" autocomplete="new-password" minlength="8" required></label>
<div class="reset-message" id="resetMessage"></div>
<button class="primary reset-submit" type="submit" id="resetSubmitBtn">確認重設密碼</button>
</form>
<a href="index.html" class="reset-back">返回後台登入</a>
</section>
</main>
<script src="../assets/js/google-sheets-config.js"></script>
<script src="../assets/js/security-guard.js"></script>
<script src="reset-password.js"></script>
</body></html>
